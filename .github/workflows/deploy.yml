# Chaque push : règles du carnet testées, front vérifié et construit. Cloudflare Pages construit et
# met en ligne lui-même la branche main ; la fonction Supabase se redéploie à la main (README).
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Règles du carnet (fonction carnet-api)
        run: node --test supabase/functions/carnet-api/rules.test.ts
      - name: Front (types et build)
        working-directory: web
        run: npm ci && npm run check && npm run build
